spring.application.name=papeleria-vero

# 1. Conexion H2 en archivo local (los datos persisten al apagar el servidor)
spring.datasource.url=jdbc:h2:file:./data/papeleria_vero_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Configuracion de JPA / Hibernate (crea las tablas automaticamente desde tus clases)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Consola web de H2 para ver tus tablas en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081