<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedores - Papelería Vero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📦 Papelería "Vero" - Gestión de Proveedores</span>
        <!-- Botón para regresar al punto de venta -->
        <a href="/pos" class="btn btn-outline-light btn-sm">Ir a Caja</a>
    </div>
</nav>

<div class="container">
    <div class="row">
        
        <!-- Panel Izquierdo: Formulario de Alta -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Nuevo Proveedor</h5>
                </div>
                <div class="card-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Empresa</label>
                            <input type="text" class="form-control" placeholder="Ej. BIC, Scribe...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contacto</label>
                            <input type="text" class="form-control" placeholder="Nombre del vendedor">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" placeholder="10 dígitos">
                        </div>
                        <button type="button" class="btn btn-primary w-100">Guardar Proveedor</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Tabla de Proveedores Registrados -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Directorio de Proveedores</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Empresa</th>
                                    <th>Contacto</th>
                                    <th>Teléfono</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="proveedor : ${listaProveedores}">
                                    <td th:text="${proveedor.id}">1</td>
                                    <td th:text="${proveedor.empresa}">Scribe</td>
                                    <td th:text="${proveedor.nombreContacto}">Juan Pérez</td>
                                    <td th:text="${proveedor.telefono}">555-1234</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-secondary">Editar</button>
                                    </td>
                                </tr>
                                <!-- Fila de ejemplo si la BD está vacía -->
                                <tr th:if="${#lists.isEmpty(listaProveedores)}">
                                    <td colspan="5" class="text-center text-muted">No hay proveedores registrados aún</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
