<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Papelería Vero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/pos">🛒 Papelería "Vero"</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/pos">Caja (POS)</a></li>
                <li class="nav-item"><a class="nav-link" href="/inventario">Inventario</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/proveedores">Proveedores</a></li>
                <li class="nav-item"><a class="nav-link" href="/usuarios">Usuarios</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 text-white" th:if="${session.usuarioLogueado != null}">
                <span class="small">
                    👤 <strong th:text="${session.usuarioLogueado.nombreCompleto}">Admin</strong>
                    <span class="badge bg-light text-primary ms-1" th:text="${session.usuarioLogueado.rol}">ADMIN</span>
                </span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- Panel Izquierdo: Alta / Edición -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="${modoEdicion} ? 'Editar Proveedor' : 'Nuevo Proveedor'">Nuevo Proveedor</h5>
                    <a th:if="${modoEdicion}" href="/proveedores" class="btn btn-sm btn-outline-secondary">Cancelar</a>
                </div>
                <div class="card-body">
                    <form th:action="@{/proveedores/guardar}" th:object="${nuevoProveedor}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Empresa</label>
                            <input type="text" th:field="*{empresa}" class="form-control" placeholder="Ej. BIC, Scribe...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contacto</label>
                            <input type="text" th:field="*{nombreContacto}" class="form-control" placeholder="Nombre del vendedor">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" th:field="*{telefono}" class="form-control" placeholder="10 dígitos">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="ventas@empresa.com">
                        </div>
                        <button type="submit" class="btn w-100"
                                th:classappend="${modoEdicion} ? 'btn-warning' : 'btn-primary'"
                                th:text="${modoEdicion} ? 'Actualizar Proveedor' : 'Guardar Proveedor'">
                            Guardar Proveedor
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Tabla de Proveedores -->
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">📦 Directorio de Proveedores</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Empresa</th>
                                    <th>Contacto</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="proveedor : ${listaProveedores}">
                                    <td th:text="${proveedor.id}">1</td>
                                    <td th:text="${proveedor.empresa}">Scribe</td>
                                    <td th:text="${proveedor.nombreContacto}">Juan Pérez</td>
                                    <td th:text="${proveedor.telefono}">555-1234</td>
                                    <td th:text="${proveedor.email}">ventas@scribe.com</td>
                                    <td class="text-nowrap">
                                        <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}"
                                           class="btn btn-sm btn-outline-warning me-1">Editar</a>
                                        <a th:href="@{/proveedores/eliminar/{id}(id=${proveedor.id})}"
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('¿Seguro que deseas eliminar este proveedor?');">Eliminar</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(listaProveedores)}">
                                    <td colspan="6" class="text-center text-muted py-3">No hay proveedores registrados aún.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
