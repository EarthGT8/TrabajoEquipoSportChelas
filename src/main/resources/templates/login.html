<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Papelería Vero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0">🛒 Papelería "Vero"</h4>
                    <small>Sistema de Punto de Venta</small>
                </div>
                <div class="card-body p-4">

                    <div th:if="${mensajeError}" class="alert alert-danger py-2 small" th:text="${mensajeError}"></div>
                    <div th:if="${mensajeExito}" class="alert alert-success py-2 small" th:text="${mensajeExito}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="username" class="form-control"
                                   th:value="${usernameIngresado}"
                                   placeholder="Ej. admin o cajero" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center text-muted small py-2">
                    Acceso restringido • Equipo SportChelas
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
