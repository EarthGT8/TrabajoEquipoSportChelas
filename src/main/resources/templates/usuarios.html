<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Papelería Vero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/pos">🛒 Papelería "Vero"</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/pos">Caja (POS)</a></li>
                <li class="nav-item"><a class="nav-link" href="/inventario">Inventario</a></li>
                <li class="nav-item"><a class="nav-link" href="/proveedores">Proveedores</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/usuarios">Usuarios</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 text-white" th:if="${session.usuarioLogueado != null}">
                <span class="small">
                    👤 <strong th:text="${session.usuarioLogueado.nombreCompleto}">Admin</strong>
                    <span class="badge bg-light text-primary ms-1" th:text="${session.usuarioLogueado.rol}">ADMIN</span>
                </span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- Panel Izquierdo: Alta / Edición de Usuario -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="${modoEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'">Nuevo Usuario</h5>
                    <a th:if="${modoEdicion}" href="/usuarios" class="btn btn-sm btn-outline-secondary">Cancelar</a>
                </div>
                <div class="card-body">
                    <form th:action="@{/usuarios/guardar}" th:object="${nuevoUsuario}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" th:field="*{nombreCompleto}" class="form-control" placeholder="Ej. Laura Gómez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Usuario (Login)</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="Ej. laura_caja">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   th:placeholder="${modoEdicion} ? 'Déjala vacía para conservar la actual' : 'Mínimo 4 caracteres'">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol de Acceso</label>
                            <select th:field="*{rol}" class="form-select">
                                <option value="CAJERO">CAJERO (Solo Caja)</option>
                                <option value="ADMIN">ADMIN (Acceso Total)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn w-100"
                                th:classappend="${modoEdicion} ? 'btn-warning' : 'btn-primary'"
                                th:text="${modoEdicion} ? 'Actualizar Usuario' : 'Guardar Usuario'">
                            Guardar Usuario
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Tabla de Usuarios -->
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">👥 Control de Usuarios y Roles</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Usuario</th>
                                    <th>Rol</th>
                                    <th>Contraseña (SHA-256)</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="usr : ${listaUsuarios}">
                                    <td th:text="${usr.id}">1</td>
                                    <td th:text="${usr.nombreCompleto}">Admin</td>
                                    <td th:text="${usr.username}">admin</td>
                                    <td>
                                        <span th:text="${usr.rol}"
                                              th:classappend="${usr.rol == 'ADMIN'} ? 'badge bg-primary' : 'badge bg-secondary'">
                                            ADMIN
                                        </span>
                                    </td>
                                    <td class="font-monospace small text-muted" th:text="${#strings.abbreviate(usr.password, 18)}">hash...</td>
                                    <td class="text-nowrap">
                                        <a th:href="@{/usuarios/editar/{id}(id=${usr.id})}"
                                           class="btn btn-sm btn-outline-warning me-1">Editar</a>
                                        <a th:href="@{/usuarios/eliminar/{id}(id=${usr.id})}"
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">Eliminar</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
