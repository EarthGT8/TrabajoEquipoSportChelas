<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Punto de Venta - Papelería Vero</title>
    <!-- Bootstrap 5 por CDN para que se vea moderno sin descargar nada -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🛒 Papelería "Vero" - Caja Registradora</span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <!-- Panel Izquierdo: Buscador de Productos -->
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Buscar Producto</h5>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Código de barras o nombre...">
                        <button class="btn btn-primary" type="button">Buscar</button>
                    </div>
                    <!-- Aquí irá la tabla de resultados -->
                    <p class="text-muted">Los productos aparecerán aquí...</p>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Carrito y Total -->
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white text-center">
                    <h5 class="mb-0">Ticket de Venta</h5>
                </div>
                <div class="card-body">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Cant</th>
                                <th>Artículo</th>
                                <th>$$$</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Las filas del carrito se llenarán aquí -->
                            <tr>
                                <td colspan="3" class="text-center text-muted">Carrito vacío</td>
                            </tr>
                        </tbody>
                    </table>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0">Total:</h4>
                        <h2 class="mb-0 text-success">$0.00</h2>
                    </div>
                    <button class="btn btn-success w-100 btn-lg">Cobrar Venta</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
