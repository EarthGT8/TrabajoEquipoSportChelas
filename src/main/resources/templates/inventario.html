<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Papelería Vero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📚 Papelería "Vero" - Control de Inventario</span>
        <div>
            <a href="/pos" class="btn btn-outline-light btn-sm me-2">Ir a Caja</a>
            <a href="/proveedores" class="btn btn-outline-light btn-sm">Proveedores</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">

        <!-- Panel Izquierdo: Altas de Productos y Categorías -->
        <div class="col-md-4">
            <!-- Formulario Nuevo Producto -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Nuevo Producto</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/inventario/guardar}" th:object="${nuevoProducto}" method="post">
                        <div class="mb-2">
                            <label class="form-label">Código de Barras</label>
                            <input type="text" th:field="*{codigoBarras}" class="form-control" placeholder="Ej. 750123456" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Libreta Scribe" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Categoría</label>
                            <select name="categoriaId" class="form-select">
                                <option value="">-- Sin categoría --</option>
                                <option th:each="cat : ${listaCategorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}">Cuadernos</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-2">
                                <label class="form-label">Precio Compra</label>
                                <input type="number" step="0.50" th:field="*{precioCompra}" class="form-control" placeholder="0.00">
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label">Precio Venta</label>
                                <input type="number" step="0.50" th:field="*{precio}" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Stock Actual</label>
                                <input type="number" th:field="*{stock}" class="form-control" placeholder="10" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Stock Mínimo</label>
                                <input type="number" th:field="*{stockMinimo}" class="form-control" value="5" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>

            <!-- Formulario Rápido de Categoría -->
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h6 class="mb-0">Nueva Categoría</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/inventario/categorias/guardar}" th:object="${nuevaCategoria}" method="post">
                        <div class="input-group">
                            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Escritura, Cuadernos..." required>
                            <button type="submit" class="btn btn-outline-primary">Agregar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Tabla de Productos -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Catálogo de Productos</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prod : ${listaProductos}">
                                    <td th:text="${prod.codigoBarras}">750123</td>
                                    <td th:text="${prod.nombre}">Libreta</td>
                                    <td th:text="${prod.categoria != null ? prod.categoria.nombre : 'General'}">Cuadernos</td>
                                    <td th:text="'$' + ${prod.precio}">$28.50</td>
                                    <td>
                                        <span th:text="${prod.stock}"
                                              th:classappend="${prod.stock <= prod.stockMinimo} ? 'badge bg-danger' : 'badge bg-success'">
                                            10
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/inventario/eliminar/{id}(id=${prod.id})}"
                                           class="btn btn-sm btn-outline-danger">Eliminar</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(listaProductos)}">
                                    <td colspan="6" class="text-center text-muted">No hay productos registrados en el inventario</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
