<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Ticket #' + ${venta.id} + ' - Papelería Vero'">Ticket - Papelería Vero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .ticket-box { max-width: 420px; margin: 2rem auto; border: 1px dashed #999; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .ticket-box { box-shadow: none !important; margin: 0 auto; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="card shadow-sm ticket-box">
        <div class="card-body p-4">
            <div class="text-center border-bottom pb-3 mb-3">
                <h4 class="fw-bold mb-0">PAPELERÍA "VERO"</h4>
                <small class="text-muted">Comprobante de Venta</small><br>
                <span class="badge bg-dark mt-2" th:text="'Folio Ticket #' + ${venta.id}">Folio Ticket #1</span>
            </div>

            <div class="small mb-3">
                <div><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm:ss')}">19/11/2026</span></div>
                <div th:if="${session.usuarioLogueado != null}">
                    <strong>Atendió:</strong> <span th:text="${session.usuarioLogueado.nombreCompleto}">Cajero</span>
                </div>
            </div>

            <table class="table table-sm small mb-3">
                <thead class="table-light">
                    <tr>
                        <th>Cant</th>
                        <th>Artículo</th>
                        <th class="text-end">P. Unit</th>
                        <th class="text-end">Importe</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="det : ${venta.detalles}">
                        <td th:text="${det.cantidad}">2</td>
                        <td th:text="${det.producto.nombre}">Libreta Scribe</td>
                        <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(det.producto.precio, 1, 2)}">$30.00</td>
                        <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(det.subtotal, 1, 2)}">$60.00</td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-3">
                <h5 class="mb-0">TOTAL PAGADO:</h5>
                <h4 class="mb-0 text-success fw-bold" th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 2)}">$60.00</h4>
            </div>

            <p class="text-center text-muted small mb-4">¡Gracias por su compra en Papelería "Vero"!</p>

            <div class="d-grid gap-2 no-print">
                <button type="button" class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
                <a href="/pos" class="btn btn-outline-secondary">← Volver a Caja</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
